<div id="chat-panel">
  <h2 id="chat-header">Select a user</h2>

  <div id="message-list"></div>

  <form id="message-form">
    <input
      type="text"
      id="message-input"
      name="message"
      placeholder="Type a message and press Enter"
      autocomplete="off"
    />
    <button type="submit">Send</button>
  </form>
</div>
